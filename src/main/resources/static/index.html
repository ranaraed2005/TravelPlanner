
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelPlanner</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            background-color: #f5f7fa;
            color: #222;
        }

        .subtitle {
            color: #666;
            margin-top: -5px;
            margin-bottom: 30px;
            font-size: 17px;
            line-height: 1.5;
        }

        .form-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .form-card h2 {
            margin-top: 0;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 40px;
            letter-spacing: -1px;
        }

        h2 {
            margin-top: 30px;
            margin-bottom: 15px;
        }

        #destinations {
            display: grid;
            gap: 20px;
            margin-top: 20px;
        }

        .destination {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .destination:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.12);
        }

        .destination h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 25px;
        }

        .country {
            font-weight: bold;
            color: #555;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .destination p {
            line-height: 1.6;
            color: #444;
        }

        .destination button {
            margin-top: 8px;
        }

        input,
        textarea,
        select {
            display: block;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            margin-bottom: 10px;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background-color: white;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        select {
            cursor: pointer;
        }

        .search-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 0;
        }

        .search-controls input,
        .search-controls select {
            width: auto;
            margin-bottom: 0;
        }

        .search-controls input {
            flex: 1;
            min-width: 220px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            padding: 9px 15px;
            margin-right: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            background-color: #2563eb;
            color: white;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .delete-button {
            background-color: #dc2626;
        }

        .cancel-button {
            background-color: #6b7280;
        }

        .secondary-button {
            background-color: #6b7280;
        }

        #message {
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 20px;
            min-height: 20px;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 15px;
            }

            h1 {
                font-size: 32px;
            }

            .search-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-controls input,
            .search-controls select,
            .search-controls button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<h1>TravelPlanner</h1>
<p class="subtitle">Discover and manage your favorite destinations</p>

<div class="form-card">

    <h2>Add a destination</h2>

    <form id="destinationForm">

        <input
                type="text"
                id="name"
                placeholder="Destination name"
                maxlength="100"
                required
        >

        <input
                type="text"
                id="country"
                placeholder="Country"
                maxlength="100"
                required
        >

        <textarea
                id="description"
                placeholder="Description"
                minlength="10"
                maxlength="255"
                required
        ></textarea>

        <button type="submit">Add Destination</button>

    </form>

</div>

<p id="message"></p>

<div id="editFormContainer" class="form-card" style="display: none;">

    <h2>Edit destination</h2>

    <form id="editForm">

        <input
                type="text"
                id="editName"
                placeholder="Destination name"
                maxlength="100"
                required
        >

        <input
                type="text"
                id="editCountry"
                placeholder="Country"
                maxlength="100"
                required
        >

        <textarea
                id="editDescription"
                placeholder="Description"
                minlength="10"
                maxlength="255"
                required
        ></textarea>

        <button type="submit">Save Changes</button>

        <button type="button" id="cancelEdit" class="cancel-button">
            Cancel
        </button>

    </form>

</div>

<div class="form-card">

    <h2>Search destinations</h2>

    <div class="search-controls">

        <select id="searchType">
            <option value="country">Country</option>
            <option value="name">Destination name</option>
        </select>

        <input
                type="text"
                id="searchInput"
                placeholder="Search by country..."
        >

        <button type="button" id="searchButton">
            Search
        </button>

        <button type="button" id="showAllButton" class="secondary-button">
            Show All
        </button>

        <select id="sortType">
            <option value="none">Sort by...</option>
            <option value="nameAsc">Name: A → Z</option>
            <option value="nameDesc">Name: Z → A</option>
            <option value="countryAsc">Country: A → Z</option>
            <option value="countryDesc">Country: Z → A</option>
        </select>

    </div>

</div>

<div id="destinations">
    Loading destinations...
</div>

<script>

    const form = document.getElementById('destinationForm');
    const message = document.getElementById('message');
    const searchType = document.getElementById('searchType');
    const searchInput = document.getElementById('searchInput');

    searchType.addEventListener('change', function() {

        if (searchType.value === 'country') {
            searchInput.placeholder = 'Search by country...';
        } else {
            searchInput.placeholder = 'Search by destination name...';
        }

    });


    // ADD DESTINATION
    form.addEventListener('submit', function(event) {

        event.preventDefault();

        const destination = {
            name: document.getElementById('name').value,
            country: document.getElementById('country').value,
            description: document.getElementById('description').value
        };

        fetch('/api/destinations', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(destination)
        })
            .then(response => {

                if (!response.ok) {
                    throw new Error('Failed to add destination');
                }

                return response.json();

            })
            .then(newDestination => {

                message.textContent =
                    newDestination.name + ' was added successfully!';

                message.style.color = '#16a34a';

                form.reset();

                loadDestinations();

            })
            .catch(error => {

                message.textContent = 'Error adding destination.';
                console.error(error);

            });

    });


    // LOAD DESTINATIONS
    function loadDestinations() {

        fetch('/api/destinations')
            .then(response => response.json())
            .then(destinations => {

                const sortType =
                    document.getElementById('sortType').value;

                if (sortType === 'nameAsc') {
                    destinations.sort((a, b) =>
                        a.name.localeCompare(b.name)
                    );
                }

                if (sortType === 'nameDesc') {
                    destinations.sort((a, b) =>
                        b.name.localeCompare(a.name)
                    );
                }

                if (sortType === 'countryAsc') {
                    destinations.sort((a, b) =>
                        a.country.localeCompare(b.country)
                    );
                }

                if (sortType === 'countryDesc') {
                    destinations.sort((a, b) =>
                        b.country.localeCompare(a.country)
                    );
                }

                const container =
                    document.getElementById('destinations');

                container.innerHTML = '';

                destinations.forEach(destination => {

                    const card = document.createElement('div');

                    card.className = 'destination';

                    card.innerHTML = `
                        <h2>${destination.name}</h2>
                        <p class="country">${destination.country}</p>
                        <p>${destination.description}</p>

                        <button class="edit-button secondary-button">
                            Edit
                        </button>

                        <button class="delete-button">
                            Delete
                        </button>
                    `;

                    const editButton =
                        card.querySelector('.edit-button');

                    editButton.addEventListener('click', function() {
                        editDestination(destination.id);
                    });

                    const deleteButton =
                        card.querySelector('.delete-button');

                    deleteButton.addEventListener('click', function() {
                        deleteDestination(destination.id);
                    });

                    container.appendChild(card);
                });
            })
            .catch(error => {

                document.getElementById('destinations').textContent =
                    'Unable to load destinations.';

                console.error(error);
            });
    }


    // EDIT DESTINATION
    let editingId = null;

    function editDestination(id) {

        message.textContent = '';

        fetch('/api/destinations/' + id)
            .then(response => {

                if (!response.ok) {
                    throw new Error('Failed to load destination');
                }

                return response.json();
            })
            .then(destination => {

                editingId = destination.id;

                document.getElementById('editName').value =
                    destination.name;

                document.getElementById('editCountry').value =
                    destination.country;

                document.getElementById('editDescription').value =
                    destination.description;

                document.getElementById('editFormContainer').style.display =
                    'block';

                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            })
            .catch(error => {

                console.error(error);
                alert('Unable to load destination.');

            });
    }


    document.getElementById('editForm').addEventListener(
        'submit',
        function(event) {

            event.preventDefault();

            if (editingId === null) {
                return;
            }

            const updatedDestination = {
                name: document.getElementById('editName').value,
                country: document.getElementById('editCountry').value,
                description: document.getElementById('editDescription').value
            };

            fetch('/api/destinations/' + editingId, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(updatedDestination)
            })
                .then(response => {

                    if (!response.ok) {
                        throw new Error('Failed to update destination');
                    }

                    return response.json();

                })
                .then(() => {

                    document.getElementById('editFormContainer').style.display =
                        'none';

                    editingId = null;

                    message.textContent =
                        'Destination updated successfully!';

                    loadDestinations();

                })
                .catch(error => {

                    console.error(error);
                    alert('Unable to update destination.');

                });
        }
    );


    document.getElementById('cancelEdit').addEventListener(
        'click',
        function() {

            document.getElementById('editFormContainer').style.display =
                'none';

            editingId = null;
        }
    );


    // DELETE DESTINATION
    function deleteDestination(id) {

        if (!confirm(
            'Are you sure you want to delete this destination?'
        )) {
            return;
        }

        fetch('/api/destinations/' + id, {
            method: 'DELETE'
        })
            .then(response => {

                if (!response.ok) {
                    throw new Error('Failed to delete destination');
                }

                message.textContent =
                    'Destination deleted successfully!';

                message.style.color = '#16a34a';

                message.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });

                loadDestinations();

            })
            .catch(error => {

                console.error(error);
                alert('Unable to delete destination.');

            });
    }


    // SEARCH WITH ENTER KEY
    document.getElementById('searchInput').addEventListener(
        'keydown',
        function(event) {

            if (event.key === 'Enter') {
                event.preventDefault();
                document.getElementById('searchButton').click();
            }

        }
    );


    // SEARCH DESTINATIONS
    document.getElementById('searchButton').addEventListener(
        'click',
        function() {

            message.textContent = '';

            const searchType =
                document.getElementById('searchType').value;

            const searchValue =
                document.getElementById('searchInput').value.trim();

            if (searchValue === '') {
                loadDestinations();
                return;
            }

            let url;

            if (searchType === 'country') {
                url = '/api/destinations/country/' +
                    encodeURIComponent(searchValue);
            } else {
                url = '/api/destinations/name/' +
                    encodeURIComponent(searchValue);
            }

            fetch(url)
                .then(response => {

                    if (!response.ok) {
                        throw new Error('Search failed');
                    }

                    return response.json();

                })
                .then(destinations => {

                    const container =
                        document.getElementById('destinations');

                    container.innerHTML = '';

                    destinations.forEach(destination => {

                        const card = document.createElement('div');

                        card.className = 'destination';

                        card.innerHTML = `
                            <h2>${destination.name}</h2>
                            <p class="country">${destination.country}</p>
                            <p>${destination.description}</p>

                            <button class="edit-button secondary-button">
                                Edit
                            </button>

                            <button class="delete-button">
                                Delete
                            </button>
                        `;

                        card.querySelector('.edit-button')
                            .addEventListener('click', function() {
                                editDestination(destination.id);
                            });

                        card.querySelector('.delete-button')
                            .addEventListener('click', function() {
                                deleteDestination(destination.id);
                            });

                        container.appendChild(card);
                    });
                })
                .catch(error => {

                    console.error(error);
                    alert('Unable to search destinations.');

                });
        }
    );


    // SHOW ALL DESTINATIONS
    document.getElementById('showAllButton').addEventListener(
        'click',
        function() {

            message.textContent = '';

            document.getElementById('searchInput').value = '';

            loadDestinations();

            document.getElementById('searchInput').focus();
        }
    );


    // SORT DESTINATIONS
    document.getElementById('sortType').addEventListener(
        'change',
        function() {
            loadDestinations();
        }
    );


    // LOAD DESTINATIONS WHEN PAGE OPENS
    loadDestinations();

</script>

</body>
</html>
